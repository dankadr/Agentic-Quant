# Research agents (LLM). They only PROPOSE: nothing here can place orders, change risk limits or
# switch mode. They run only while secrets/llm_api_key is present.
agents:
  llm:
    base_url: https://chat.daria-e.com/v1   # OpenAI-compatible (Unsloth Studio)
    model: DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF:Q6_K
    timeout_seconds: 120
    max_tokens: 4000
  macro:
    enabled: true
    # true  = spec behaviour: a missing/stale macro view blocks NEW entries of dependent strategies.
    # false = a missing/stale view is ignored (multiplier 1), but is recorded.
    # PoC: false, so an unloaded/unreachable model does not silently stop all trading. Flip to true
    # (spec behaviour) once the endpoint has proven reliable.
    required: false
    ttl_minutes: 60
    run_every_minutes: 30
    first_run_after_open_minutes: 16     # after the 15-minute opening range
    dependent_strategies: [orb_v1, vwap_v1]
    # Owner decision 2026-10-31: caution may shrink an entry to 70% at most. A view of 0 still means
    # no new entries, and exits are never touched.
    min_multiplier: 0.7
  evaluator:
    enabled: true
  # Tried on real data (Alpaca news, Friday's backtest) before enabling.
  fundamental:
    enabled: true           # watchlist + catalysts from Alpaca news; needs the LLM key
    lookback_hours: 18
    max_headlines: 60
    ttl_hours: 20
  consensus:
    enabled: true           # shadow only: agreement/veto counterfactual, no model, no authority
  technical:
    enabled: false          # manual (`trading technical`); proposes strategy parameter changes from recorded experiments
  suggestions:
    # Evidence a settings suggestion needs before it can be proposed; below this it only 'watches'.
    min_days: 10
    min_decisions: 30
