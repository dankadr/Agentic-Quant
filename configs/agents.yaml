# Research agents (LLM). They only PROPOSE: nothing here can place orders, change risk limits or
# switch mode. They run only while secrets/llm_api_key is present.
agents:
  llm:
    base_url: https://chat.daria-e.com/v1   # OpenAI-compatible (Unsloth Studio)
    model: unsloth/Qwen3.8-27B-GGUF
    timeout_seconds: 120
    max_tokens: 1200
  macro:
    enabled: true
    # true  = spec behaviour: a missing/stale macro view blocks NEW entries of dependent strategies.
    # false = a missing/stale view is ignored (multiplier 1), but is recorded.
    # PoC: false, so an unloaded/unreachable model does not silently stop all trading. Flip to true
    # (spec behaviour) once the endpoint has proven reliable.
    required: false
    ttl_minutes: 60
    run_every_minutes: 30
    first_run_after_open_minutes: 16     # after the 15-minute opening range
    dependent_strategies: [orb_v1, vwap_v1]
  evaluator:
    enabled: true
