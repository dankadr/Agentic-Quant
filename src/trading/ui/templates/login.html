{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/ui/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>API key <input name="api_key" type="password" autocomplete="off" required maxlength="200"></label>
  <button type="submit">Sign in</button>
</form>
<p class="muted">The key is exchanged for a 30-minute session. It is not kept in the browser.</p>
{% endblock %}
