{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if rows %}
<table>
  <tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr>
  {% for row in rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>{% endfor %}
</table>
{% else %}<p class="muted">Nothing to show.</p>{% endif %}
{% endblock %}
