<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Paper Trading</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar" id="topbar" hidden>
    <div class="brand"><span class="logo" aria-hidden="true"></span><strong>Paper Trading</strong></div>
    <div id="badges" class="badges" aria-label="System status"></div>
    <div class="spacer"></div>
    <div class="controls">
    <label class="datepick">
      <span class="sr-only">Session date</span>
      <input id="date" type="date">
    </label>
    <button id="live" type="button" class="btn ghost" title="Back to the live session">Live</button>
    <span id="updated" class="muted small" role="status" aria-live="polite"></span>
    <button id="theme" type="button" class="btn icon" aria-label="Toggle light and dark theme"></button>
    <button id="pause" type="button" class="btn warn" title="Pause new entries (operator key required)">Pause</button>
    <button id="logout" type="button" class="btn ghost">Sign out</button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Sections" hidden></nav>

  <main id="view" tabindex="-1" hidden></main>

  <section id="login" class="login" hidden>
    <div class="login-card">
      <h1>Paper Trading</h1>
      <p class="muted">Local dashboard. Paste an API key: a viewer key can look, an operator key can also pause trading and review proposals. It stays in this tab only.</p>
      <form id="login-form">
        <label for="key">API key</label>
        <input id="key" type="password" autocomplete="off" placeholder="trk_..." required>
        <button type="submit" class="btn primary">Connect</button>
      </form>
      <p id="login-error" class="bad" role="alert"></p>
    </div>
  </section>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="dialog-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="dialog-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
